# 경제일정 앱: 시장 심리 지수 매주 자동 갱신
# - STLFSI4 는 매주 목요일(미국 시간)에 새 값이 나오므로, 한국 시간 금요일·토요일 오전에 두 번 확인
# - 수동 실행: 저장소 > Actions > "시장 심리 지수 갱신" > Run workflow
name: 시장 심리 지수 갱신

on:
  schedule:
    - cron: "17 0 * * 5"   # 매주 금요일 00:17 UTC (한국 09:17)
    - cron: "17 0 * * 6"   # 매주 토요일 00:17 UTC (한국 09:17, 금요일에 못 받았을 때 대비)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시장 심리 지수 계산
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 scripts/update_sentiment.py
      - name: JSON 형식 확인
        run: python3 -c "import json; json.load(open('key_schedule.json', encoding='utf-8'))"
      - name: 바뀌었으면 저장
        run: |
          if git diff --quiet -- key_schedule.json; then
            echo "변경 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add key_schedule.json
            git commit -m "시장 심리 지수 자동 갱신"
            git push
          fi
